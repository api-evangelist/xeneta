  /ocean/carrier-spread:
    get:
      summary: Get carrier rates
      description: Returns freight rates for the requested [carrier](ref:list-all-carriers-spread).
      operationId: get-carrier-rates
      parameters:
      - name: origin
        in: query
        description: Defines the origin location of the requested carrier rate data. Can be either a UN/LOCODE or a region as defined in Xeneta's [geo-hierarchy](https://www.xeneta.com/hubfs/2025-ocean-geo/xeneta-ocean-geo.html). For example, `CNSGH` or `china_east_main`.
        required: true
        schema:
          type: string
          default: CNSGH
      - name: destination
        in: query
        description: Defines the destination location of the requested carrier rate data. Can be either a UN/LOCODE or a region as defined in Xeneta's [geo-hierarchy](https://www.xeneta.com/hubfs/2025-ocean-geo/xeneta-ocean-geo.html). For example, `NLRTM` or `north_europe_main`.
        required: true
        schema:
          type: string
          default: NLRTM
      - name: date_from
        in: query
        description: Defines the start date of the date range for the requested carrier rates in the `YYYY-MM-DD` format. The total range cannot exceed 31 days.
        required: true
        schema:
          type: string
          format: date
          default: '2023-02-01'
      - name: date_to
        in: query
        description: Defines the end date of the date range for the requested carrier rates in the `YYYY-MM-DD` format. The total range cannot exceed 31 days.
        required: true
        schema:
          type: string
          format: date
          default: '2023-02-03'
      - name: carrier_slug
        in: query
        description: Defines the [carrier](ref:list-all-carriers-spread) whose rates to request.
        required: true
        schema:
          type: string
          default: cma_cgm
      - name: contract_length
        in: query
        description: Defines the type of contract for the requested carrier rate data. Accepted values are `long` or `short`.
        required: true
        schema:
          type: string
          default: short
      - name: contracted_within
        in: query
        description: Defines the maximum age of the contracts to be included in the requested carrier rate data, relative to each day. Accepted values include `all`, `3months` and `6months`. Using any value other than `all` when `contract_length` is set to `short` will return an error.
        required: true
        schema:
          type: string
          default: all
      - name: container_type
        in: query
        description: Defines the container type of the requested carrier rate data. Accepted values include `20DC`, `20RE`, `20TK`, `40DC`, `40RH` and `40HC`.
        required: true
        schema:
          type: string
          default: 40DC
      - name: thc_methodology
        in: query
        description: Defines whether the requested carrier rate data should include the terminal handling charge. Accepted values include `meth`, `othc`, `dthc`, `none` and `both`. Selecting `meth` will use Xeneta's default [methodology](https://help.xeneta.com/docs/terminal-handling-charges) for the requested origin and destination.
        required: true
        schema:
          type: string
          default: meth
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"meta\": {\n    \"asked_origin\": {\n      \"location\": \"CNSGH\",\n      \"name\": \"Shanghai\",\n      \"type\": \"Port\",\n      \"allow_aggregation\": true,\n      \"geo_level\": 6\n    },\n    \"asked_destination\": {\n      \"location\": \"NLRTM\",\n      \"name\": \"Rotterdam\",\n      \"type\": \"Port\",\n      \"allow_aggregation\": true,\n      \"geo_level\": 4\n    },\n    \"actual_origin\": {\n      \"location\": \"china_main\",\n      \"name\": \"China Main\",\n      \"type\": \"Region\",\n      \"allow_aggregation\": true,\n      \"geo_level\": 4\n    },\n    \"actual_destination\": {\n      \"location\": \"north_europe_main\",\n      \"name\": \"North Europe Main\",\n      \"type\": \"Region\",\n      \"allow_aggregation\": true,\n      \"geo_level\": 3\n    },\n    \"default_thc_methodology\": {\n      \"thc_class\": \"none\",\n      \"dthc_applicable\": true,\n      \"othc_applicable\": true\n    },\n    \"carrier\": {\n      \"name\": \"\
                    CMA CGM\",\n      \"slug\": \"cma_cgm\"\n    }\n  },\n  \"carrier_spread_by_day\": {\n    \"mean\": [\n      {\n        \"day\": \"2023-02-01\",\n        \"value\": 1551\n      },\n      {\n        \"day\": \"2023-02-02\",\n        \"value\": 1551\n      },\n      {\n        \"day\": \"2023-02-03\",\n        \"value\": 1551\n      }\n    ],\n    \"low\": [\n      {\n        \"day\": \"2023-02-01\",\n        \"value\": 1350\n      },\n      {\n        \"day\": \"2023-02-02\",\n        \"value\": 1350\n      },\n      {\n        \"day\": \"2023-02-03\",\n        \"value\": 1350\n      }\n    ],\n    \"high\": [\n      {\n        \"day\": \"2023-02-01\",\n        \"value\": 2019\n      },\n      {\n        \"day\": \"2023-02-02\",\n        \"value\": 2019\n      },\n      {\n        \"day\": \"2023-02-03\",\n        \"value\": 2019\n      }\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      asked_origin:
                        type: object
                        properties:
                          location:
                            type: string
                            example: CNSGH
                          name:
                            type: string
                            example: Shanghai
                          type:
                            type: string
                            example: Port
                          allow_aggregation:
                            type: boolean
                            example: true
                            default: true
                          geo_level:
                            type: integer
                            example: 6
                            default: 0
                      asked_destination:
                        type: object
                        properties:
                          location:
                            type: string
                            example: NLRTM
                          name:
                            type: string
                            example: Rotterdam
                          type:
                            type: string
                            example: Port
                          allow_aggregation:
