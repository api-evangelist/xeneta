aid: xeneta
name: Xeneta
description: >-
  Xeneta is an ocean and air freight rate benchmarking and market analytics
  platform headquartered in Oslo, Norway. It crowdsources contracted freight
  rates from shippers and forwarders into the world's largest rate database,
  and its REST API (v3.0) exposes ocean and air market rates, your own
  contracted prices, carrier spread, estimated rates, capacity, carbon
  emissions, and schedule reliability data, plus a separate airline reports
  API for airlines, shippers, and freight forwarders.
