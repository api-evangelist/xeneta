apis:
- name: Xeneta Airline Data API
  description: >-
    Airline reports API (Selfie) serving rates, chargeable weight, load factor, and capacity reports as
    CSV files in ZIP archives. Airlines use a branded host (https://{airline}.useselfie.com/api/selfie/v1);
    shippers and freight forwarders use the shared yy host. Session-cookie authentication via POST /api/selfie/rest_auth/login.
  humanURL: https://help.xeneta.com/reference/airline-overview
